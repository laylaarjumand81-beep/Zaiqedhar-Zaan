<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaiqedar Zaan Chat Widget Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #2d2d2d 0%, #1a1a1a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .demo-container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .demo-container h1 {
            color: #c9a961;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .demo-container p {
            color: #666;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .demo-label {
            display: inline-block;
            background: #f0f0f0;
            padding: 8px 16px;
            border-radius: 6px;
            color: #333;
            font-size: 12px;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        /* ===== CHAT WIDGET STYLES ===== */
        .chat-widget-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            z-index: 9999;
        }

        /* Chat Button */
        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #c9a961 0%, #b39050 100%);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(201, 169, 97, 0.4);
            transition: all 0.3s ease;
            font-size: 24px;
        }

        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(201, 169, 97, 0.6);
        }

        .chat-button:active {
            transform: scale(0.95);
        }

        .chat-button.open {
            opacity: 0;
            pointer-events: none;
            transform: scale(0);
            transition: all 0.3s ease;
        }

        /* Chat Window */
        .chat-window {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .chat-window.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        /* Chat Header */
        .chat-header {
            background: linear-gradient(135deg, #c9a961 0%, #b39050 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 60px;
        }

        .chat-header-title {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        .chat-header-subtitle {
            font-size: 12px;
            opacity: 0.9;
            margin: 4px 0 0 0;
        }

        .close-button {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .close-button:hover {
            transform: rotate(90deg);
            opacity: 0.8;
        }

        /* Messages Container */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f9f9f9;
        }

        /* Message Bubble */
        .message {
            display: flex;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: #c9a961;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-bubble {
            background: #e8e8e8;
            color: #333;
            border-bottom-left-radius: 4px;
        }

        /* Input Area */
        .chat-input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .chat-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
            transition: border-color 0.2s ease;
        }

        .chat-input:focus {
            outline: none;
            border-color: #c9a961;
            box-shadow: 0 0 0 2px rgba(201, 169, 97, 0.1);
        }

        .send-button {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #c9a961;
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-button:hover {
            background: #b39050;
            transform: scale(1.05);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: scale(1);
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c9a961;
            border-radius: 3px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #b39050;
        }

        /* Mobile Responsive */
        @media (max-width: 480px) {
            .chat-window {
                width: 100vw;
                height: 100vh;
                max-width: 100%;
                max-height: 100%;
                bottom: 0;
                right: 0;
                border-radius: 0;
            }

            .chat-widget-container {
                bottom: 20px;
                right: 20px;
            }

            .chat-button {
                width: 56px;
                height: 56px;
            }

            .message-bubble {
                max-width: 85%;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Container -->
    <div class="demo-container">
        <h1>✓ Chat Widget Ready</h1>
        <p>The floating chat widget is active in the bottom-right corner.</p>
        <p style="color: #c9a961; font-weight: 600;">Click the chat button to start testing!</p>
        <div class="demo-label">Responsive • Mobile-Friendly • No API Required</div>
    </div>

    <!-- Chat Widget -->
    <div class="chat-widget-container">
        <button class="chat-button" id="chatButton" title="Open Chat">
            💬
        </button>

        <div class="chat-window" id="chatWindow">
            <div class="chat-header">
                <div>
                    <p class="chat-header-title">Zaiqedar Zaan Assistant</p>
                    <p class="chat-header-subtitle">We're here to help</p>
                </div>
                <button class="close-button" id="closeButton">✕</button>
            </div>

            <div class="chat-messages" id="chatMessages"></div>

            <div class="chat-input-area">
                <textarea
                    class="chat-input"
                    id="chatInput"
                    placeholder="Type your message..."
                    rows="1"
                ></textarea>
                <button class="send-button" id="sendButton">➤</button>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const chatButton = document.getElementById('chatButton');
        const closeButton = document.getElementById('closeButton');
        const chatWindow = document.getElementById('chatWindow');
        const chatInput = document.getElementById('chatInput');
        const sendButton = document.getElementById('sendButton');
        const chatMessages = document.getElementById('chatMessages');

        // State
        let isWindowOpen = false;

        // Open/Close Chat Window
        chatButton.addEventListener('click', () => {
            isWindowOpen = true;
            chatWindow.classList.add('visible');
            chatButton.classList.add('open');
            chatInput.focus();
        });

        closeButton.addEventListener('click', () => {
            isWindowOpen = false;
            chatWindow.classList.remove('visible');
            chatButton.classList.remove('open');
        });

        // Auto-expand textarea
        chatInput.addEventListener('input', () => {
            chatInput.style.height = 'auto';
            chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
        });

        // Send Message
        function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Show user message immediately
            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendButton.disabled = true;

            // Simulate bot typing and send reply after 800ms
            setTimeout(() => {
                addMessage(
                    "Hi! I'm Zaiqedar Zaan Assistant. My AI brain isn't connected yet.",
                    'bot'
                );
                sendButton.disabled = false;
            }, 800);
        }

        function addMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;

            messageDiv.appendChild(bubble);
            chatMessages.appendChild(messageDiv);

            // Scroll to bottom
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Send on button click
        sendButton.addEventListener('click', sendMessage);

        // Send on Enter (Shift+Enter for new line)
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
